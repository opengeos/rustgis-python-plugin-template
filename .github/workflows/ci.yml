name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The RustGIS release the plugin is run in: the latest, unless the RUSTGIS_VERSION repository
  # variable names one (v0.3.0).
  RUSTGIS_VERSION: ${{ vars.RUSTGIS_VERSION }}

jobs:
  build:
    name: Test, check and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
      - name: Install the plugin's requirements and pytest
        run: pip install -r plugin/requirements.txt pytest
      - name: Tests
        run: pytest
      - name: Check and package
        run: python scripts/package.py
      - name: Download rustgis-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $RUSTGIS_VERSION --repo opengeos/RustGIS --pattern 'RustGIS-*-linux-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/RustGIS-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          echo "RUSTGIS_CLI=$(ls "$RUNNER_TEMP"/RustGIS-*-linux-x86_64/rustgis-cli)" >> "$GITHUB_ENV"
      - name: Run the plugin in RustGIS
        run: python scripts/smoke.py --cli "$RUSTGIS_CLI"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*.rgplugin

  # The template's own check that every starter runs; skipped in your repository.
  starters:
    name: Starter ${{ matrix.starter }}
    if: github.repository == 'opengeos/rustgis-python-plugin-template'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starter: [commands, tab, panel, tools]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Use the starter
        run: python scripts/setup.py --starter ${{ matrix.starter }} --id my-plugin --name "My Plugin"
      - name: Install the plugin's requirements and pytest
        run: pip install -r plugin/requirements.txt pytest
      - name: Tests
        run: pytest
      - name: Check and package
        run: python scripts/package.py
      - name: Download rustgis-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $RUSTGIS_VERSION --repo opengeos/RustGIS --pattern 'RustGIS-*-linux-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/RustGIS-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          echo "RUSTGIS_CLI=$(ls "$RUNNER_TEMP"/RustGIS-*-linux-x86_64/rustgis-cli)" >> "$GITHUB_ENV"
      - name: Run the starter in RustGIS
        run: python scripts/smoke.py --cli "$RUSTGIS_CLI" --strict
